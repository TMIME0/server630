<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل بيانات العضو</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
            direction: rtl;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .save-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .save-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تعديل بيانات العضو</h2>
    <form id="editMemberForm">
        
        <div class="form-group">
            <label for="memberName">اسم العضو:</label>
            <input type="text" id="memberName" value="محمد">
        </div>

        <div class="form-group">
            <label for="memberEmail">البريد الإلكتروني:</label>
            <input type="email" id="memberEmail" value="mohammed@example.com">
        </div>

        <!-- زر الحفظ الجاهز -->
        <button type="submit" id="saveMemberBtn" class="save-btn">حفظ البيانات</button>

    </form>
</div>

<script>
    // ربط الحدث عند الضغط على زر الحفظ أو إرسال الفورم
    document.getElementById('editMemberForm').addEventListener('submit', function(event) {
        event.preventDefault(); // منع إعادة تحميل الصفحة

        // 1. سحب البيانات الجديدة من الحقول
        const updatedData = {
            name: document.getElementById('memberName').value,
            email: document.getElementById('memberEmail').value
        };

        // 2. إرسال البيانات للسيرفر (غير الـ URL حسب رابط السيرفر عندك)
        fetch('/api/update_member', {
            method: 'POST', // أو PUT حسب رغبة الـ Backend
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(updatedData)
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            }
            throw new Error('فشل الاتصال بالسيرفر');
        })
        .then(data => {
            alert('تم حفظ البيانات بنجاح يا بطل! 🚀');
            console.log('Success:', data);
        })
        .catch(error => {
            alert('عذراً، صار خطأ وما انحفظت البيانات.');
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة Server 630</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>لوحة إدارة Server 630</h2>
        <p>قم بتعديل البيانات وحفظها لتتحدث سحابياً على GitHub</p>
        
        <textarea id="dataEditor" rows="10" style="width: 100%; background: #2d2d2d; color: #fff; padding: 10px; border-radius: 5px; border: 1px solid #444;"></textarea>
        
        <button onclick="saveData()">حفظ التحديثات</button>
        <div id="status"></div>
    </div>

    <script>
        // رابط الـ Web App الخاص بك على Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxwhlsqobiCy0am8pgw7xp3pDP9pFhuAa6Hqyb99MCIWakYylGnemVziJw_zH-JSFT0PA/exec";

        // جلب البيانات الحالية عند فتح الصفحة
        async function loadData() {
            document.getElementById("status").innerText = "جاري تحميل البيانات...";
            try {
                let response = await fetch('data.json?t=' + new Date().getTime());
                let data = await response.json();
                document.getElementById("dataEditor").value = JSON.stringify(data, null, 2);
                document.getElementById("status").innerText = "تم تحميل البيانات بنجاح.";
            } catch (error) {
                document.getElementById("status").innerText = "فشل في تحميل البيانات.";
            }
        }

        // حفظ البيانات وإرسالها عبر السكربت
        async function saveData() {
            document.getElementById("status").innerText = "جاري الحفظ والرفع سحابياً...";
            try {
                let rawData = document.getElementById("dataEditor").value;
                let parsedData = JSON.parse(rawData);

                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(parsedData)
                });

                document.getElementById("status").innerText = "تم إرسال التحديثات بنجاح إلى GitHub!";
            } catch (error) {
                document.getElementById("status").innerText = "خطأ في صيغة الـ JSON أو الاتصال!";
            }
        }

        // تشغيل دالة الجلب عند فتح الموقع
        loadData();
    </script>

</body>
</html>

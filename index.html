<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة بيانات الجيش - سرفر 630</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Tahoma, sans-serif;
            color: white;
        }

        body {
            background: #000 url('photo_2026-07-30_07-05-40.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #ffcc00;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            text-align: center;
        }

        th, td {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 150, 255, 0.4);
            color: #fff;
        }

        .update-time {
            text-align: left;
            font-size: 13px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-title">لوحة تحكم إمدادات الجيش - سرفر 630</div>
        
        <table>
            <thead>
                <tr>
                    <th>اسم العضو</th>
                    <th>نوع القوات</th>
                    <th>الكمية المتاحة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <!-- البيانات يتم جلبها وحقنها تلقائياً من ملف الداتا -->
            </tbody>
        </table>

        <div class="update-time">
            آخر تحديث للبيانات: <span id="timeField">جاري التحميل...</span>
        </div>
    </div>

    <!-- ربط ملف البيانات الخارجي (تأكد أن اسم الملف مطابق، مثلاً data.js) -->
    <script src="data.js"></script>

    <script>
        // التحقق من وجود البيانات في ملف الداتا المربوط وعرضها بالجداول
        const tableBody = document.getElementById('data-table-body');
        
        if (typeof armyData !== 'undefined' && Array.isArray(armyData)) {
            tableBody.innerHTML = ''; // تنظيف الحقل
            armyData.forEach(item => {
                const row = `<tr>
                    <td>${item.name}</td>
                    <td>${item.troopType}</td>
                    <td>${item.quantity}</td>
                    <td style="color: ${item.status === 'جاهز' ? '#00ffcc' : '#ffcc00'};">${item.status}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } else {
            tableBody.innerHTML = `<tr><td colspan="4" style="color: #ff4d4d;">خطأ: لم يتم العثور على ملف الداتا أو أن تنسيق البيانات غير صحيح!</td></tr>`;
        }

        // تحديث الوقت والتاريخ الحالي
        const now = new Date();
        const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('timeField').innerText = now.toLocaleDateString('ar-EG', options);
    </script>

</body>
</html>

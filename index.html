<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السيرفر 630 - التحليل الذكي للجيش</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0b0b;
            color: #detafe;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #detafe;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffd700;
        }
        .upload-box {
            border: 2px dashed #detafe;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-box:hover {
            background: #222;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background: #e6c200;
        }
        .results {
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        #loading {
            text-align: center;
            color: #ffd700;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>رفع وتحليل بيانات الجيش ⚔️</h2>
    
    <!-- منطقة الرفع -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>اضغط هنا لاختيار أو رفع صورة الجيش</p>
        <span id="fileName" style="color: #888; font-size: 14px;">لم يتم اختيار ملف</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="showFileName()">

    <button class="btn" onclick="analyzeImage()">تحليل واستخراج البيانات تلقائياً</button>
    <div id="loading">جاري تحليل الصورة بواسطة الذكاء الاصطناعي... انتظر ثواني ⏳</div>

    <!-- الحقول التلقائية -->
    <div class="results">
        <div class="form-group">
            <label>اسم اللاعب / التفاصيل:</label>
            <input type="text" id="resultName" placeholder="سيظهر هنا تلقائياً...">
        </div>
        <div class="form-group">
            <label>بيانات الجيش المستخرجة:</label>
            <textarea id="resultData" rows="4" placeholder="ستظهر التفاصيل هنا تلقائياً..."></textarea>
        </div>
    </div>
</div>

<script>
    function showFileName() {
        const input = document.getElementById('fileInput');
        const fileNameSpan = document.getElementById('fileName');
        if (input.files.length > 0) {
            fileNameSpan.textContent = input.files[0].name;
        }
    }

    async function analyzeImage() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert('اختر صورة الجيش بالبداية يا غالي!');
            return;
        }

        const file = fileInput.files[0];
        const loading = document.getElementById('loading');
        loading.style.display = 'block';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function () {
            const base64Image = reader.result.split(',')[1];
            
            try {
                // استبدل 'YOUR_API_KEY' بمفتاح الـ API الخاص بك
                const apiKey = "YOUR_API_KEY"; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "قم بتحليل لقطة الشاشة هذه الخاصة بجيش اللعبة، استخرج اسم اللاعب وضعْه في البداية، ثم لخص أعداد الجنود والتفاصيل العسكرية بشكل دقيق ومنظم." },
                                {
                                    inline_data: {
                                        mime_type: file.type,
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    
                    // تعبئة الحقول تلقائياً بالنتائج
                    document.getElementById('resultName').value = "تم استخراج البيانات بنجاح";
                    document.getElementById('resultData').value = aiText.trim();
                } else {
                    alert('مكوصلت نتيجة صحيحة من الذكاء الاصطناعي، جرب صورة أوضح.');
                }

            } catch (error) {
                console.error(error);
                alert('حدث خطأ بالاتصال، تأكد من مفتاح الـ API.');
            } finally {
                loading.style.display = 'none';
            }
        };
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة لوحة تحكم جيش السيرفر</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen">

    <!-- شاشة التحميل (سيتم إخفاؤها فوراً بعد جلب البيانات) -->
    <div id="sync-loading" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-yellow-500 mb-4"></div>
        <div class="text-yellow-400 font-bold text-lg">جاري تحميل بيانات السيرفر...</div>
    </div>

    <!-- المحتوى الرئيسي للموقع -->
    <div class="p-6">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-yellow-500">لوحة تحكم السيرفر</h1>
            <div id="cloud-status" class="text-xs text-green-400 bg-green-950/40 px-3 py-1.5 rounded-xl border border-green-800 font-bold">متصل 🟢</div>
        </header>

        <div id="content-container">
            <!-- هنا تظهر بيانات الأعضاء والتحكم -->
        </div>
    </div>

    <script>
        let membersData = [];
        let admins = [];
        let loggedInMemberId = null;

        function initDefaultMembers() {
            membersData = [];
            for (let i = 1; i <= 75; i++) {
                membersData.push({
                    id: i,
                    castleName: i === 1 ? 'قمة' : '',
                    castleType: 'dual',
                    email: `member${i}@alliance.com`,
                    pass: `pass${i}`,
                    gameEmail: `game${i}@game.com`,
                    gamePass: `gpass${i}`,
                    infantryArmored: 0,
                    archerArmored: 0,
                    infantrySuper: 0
                });
            }
        }

        async function loadFromCloud() {
            const statusDiv = document.getElementById('cloud-status');
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                if (data && data.members && data.members.length > 0) {
                    membersData = data.members;
                } else {
                    initDefaultMembers();
                }
                
                if (data && data.admins) {
                    admins = data.admins;
                }
                
                if (statusDiv) {
                    statusDiv.innerText = "متصل 🟢";
                    statusDiv.className = "text-xs text-green-400 bg-green-950/40 px-3 py-1.5 rounded-xl border border-green-800 font-bold";
                }
            } catch (e) {
                initDefaultMembers();
                if (statusDiv) {
                    statusDiv.innerText = "وضع الافتراضي ⚠️";
                    statusDiv.className = "text-xs text-yellow-400 bg-yellow-950/40 px-3 py-1.5 rounded-xl border border-yellow-800 font-bold";
                }
            } finally {
                // إخفاء شاشة التحميل بشكل نهائي وفوري لفتح الموقع كالبرق
                const loadingScreen = document.getElementById('sync-loading');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                    loadingScreen.style.display = 'none';
                }
            }
        }

        // تشغيل التحميل فور دخول الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            loadFromCloud();
        });
    </script>
</body>
</html>
